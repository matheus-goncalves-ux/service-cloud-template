<template>
    <div class="slds-p-around_large c-service-home">
        <!-- Greeting header -->
        <header class="slds-m-bottom_medium">
            <h1 class="slds-text-heading_large c-service-home__title">Início do agente</h1>
            <p class="slds-text-body_regular c-service-home__subtitle slds-m-top_xx-small">{greeting}</p>
        </header>

        <!-- Row 1: hero KPI cards -->
        <ul class="slds-grid slds-wrap slds-gutters">
            <template for:each={cards} for:item="card">
                <li
                    key={card.id}
                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-vertical_x-small">
                    <lightning-card icon-name={card.icon} class="c-kpi">
                        <span slot="title" class="c-kpi__title">{card.title}</span>
                        <div class="slds-p-horizontal_medium">
                            <p class="c-kpi__desc slds-text-body_small slds-text-color_weak">
                                {card.description}
                            </p>
                            <div class="c-kpi__body slds-m-top_medium">
                                <div class={card.ringClass} aria-hidden="true">
                                    <span class="c-ring__primary">{card.ringPrimary}</span>
                                    <span class="c-ring__label">{card.ringLabel}</span>
                                </div>
                                <ul class="c-legend">
                                    <template for:each={card.legend} for:item="row">
                                        <li key={row.key} class="c-legend__item">
                                            <span class={row.dotClass} aria-hidden="true"></span>
                                            <span class={row.badgeClass}>{row.text}</span>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </div>
                        <div slot="footer" class="slds-text-align_center">
                            <lightning-button
                                label={card.button.label}
                                variant="neutral"
                                data-path={card.button.path}
                                onclick={handleNavigate}>
                            </lightning-button>
                        </div>
                    </lightning-card>
                </li>
            </template>
        </ul>

        <!-- Row 2: FCR, overdue SLA cases, recent cases -->
        <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">

            <!-- FCR — First Contact Resolution -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-vertical_x-small">
                <lightning-card icon-name="utility:metrics" class="c-tile">
                    <span slot="title" class="c-kpi__title">FCR</span>
                    <div class="slds-p-horizontal_medium">
                        <p class="c-kpi__desc slds-text-body_small slds-text-color_weak">
                            Resolução no primeiro contato — últimos 30 dias
                        </p>
                        <div class="c-kpi__body slds-m-top_medium">
                            <div class="c-ring c-ring_success" aria-hidden="true">
                                <span class="c-ring__primary">{fcr.pct}%</span>
                                <span class="c-ring__label">FCR</span>
                            </div>
                            <ul class="c-legend">
                                <template for:each={fcr.legend} for:item="row">
                                    <li key={row.key} class="c-legend__item">
                                        <span class={row.dotClass} aria-hidden="true"></span>
                                        <span class={row.badgeClass}>{row.text}</span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                    <div slot="footer" class="slds-text-align_center">
                        <lightning-button label="Ver relatório" variant="neutral"></lightning-button>
                    </div>
                </lightning-card>
            </div>

            <!-- Casos com SLA vencido (empty state when none) -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-vertical_x-small">
                <lightning-card icon-name="standard:case_milestone" class="c-tile">
                    <span slot="title" class="c-kpi__title">SLA vencido</span>
                    <template if:false={hasOverdueCases}>
                        <div
                            class="slds-illustration slds-illustration_small slds-p-around_medium slds-text-align_center c-empty">
                            <img src="/images/empty-state-tasks.svg" alt="" class="c-empty__img" />
                            <p class="slds-text-body_regular slds-text-color_weak slds-m-top_small">
                                Nenhum caso com SLA vencido. Continue assim!
                            </p>
                        </div>
                    </template>
                    <template if:true={hasOverdueCases}>
                        <ul class="c-recent slds-p-horizontal_medium">
                            <template for:each={overdueCases} for:item="c">
                                <li key={c.id} class="c-recent__item">
                                    <lightning-icon
                                        icon-name="standard:case"
                                        size="small"
                                        alternative-text=""
                                        class="slds-m-right_small">
                                    </lightning-icon>
                                    <a
                                        href="#"
                                        class="c-recent__link slds-truncate"
                                        title={c.subject}
                                        data-path={c.path}
                                        onclick={handleNavigate}>{c.caseNumber}</a>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <div slot="footer" class="slds-text-align_center">
                        <lightning-button label="Ver casos" variant="neutral" data-path="/cases" onclick={handleNavigate}></lightning-button>
                    </div>
                </lightning-card>
            </div>

            <!-- Casos recentes -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-vertical_x-small">
                <lightning-card icon-name="standard:case" class="c-tile">
                    <span slot="title" class="c-kpi__title">Casos recentes</span>
                    <ul class="c-recent slds-p-horizontal_medium">
                        <template for:each={recentCases} for:item="rec">
                            <li key={rec.id} class="c-recent__item">
                                <lightning-icon
                                    icon-name={rec.icon}
                                    size="small"
                                    alternative-text=""
                                    class="slds-m-right_small">
                                </lightning-icon>
                                <a
                                    href="#"
                                    class="c-recent__link slds-truncate"
                                    title={rec.name}
                                    data-path={rec.path}
                                    onclick={handleNavigate}>{rec.name}</a>
                            </li>
                        </template>
                    </ul>
                </lightning-card>
            </div>
        </div>
    </div>
</template>
