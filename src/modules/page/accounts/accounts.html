<template>
    <div class="slds-p-horizontal_medium">
        <ui-page-header
            variant="object-home"
            icon-name="standard:account"
            object-label="Contas"
            title="Todas as Contas"
            meta-text={metaText}
            onsearch={handleSearch}>
            <lightning-button-icon
                slot="switcher"
                icon-name="utility:down"
                variant="bare"
                size="small"
                alternative-text="Mudar visualização"
                title="Mudar visualização">
            </lightning-button-icon>
            <div slot="actions">
                <div class="slds-page-header__controls">
                    <div class="slds-page-header__control">
                        <lightning-button-group>
                            <lightning-button label="Nova Conta" variant="brand"></lightning-button>
                            <lightning-button label="Importar" variant="neutral"></lightning-button>
                        </lightning-button-group>
                    </div>
                    <div class="slds-page-header__control">
                        <lightning-button-menu
                            alternative-text="Mais Ações"
                            variant="border-filled"
                            icon-size="medium"
                            menu-alignment="right">
                            <lightning-menu-item label="Visão Impressa" value="print"></lightning-menu-item>
                            <lightning-menu-item label="Exportar" value="export"></lightning-menu-item>
                        </lightning-button-menu>
                    </div>
                </div>
            </div>
        </ui-page-header>

        <lightning-datatable
            key-field="id"
            data={filteredData}
            columns={columns}
            sorted-by={sortedBy}
            sorted-direction={sortedDirection}
            onsort={handleSort}
            onrowaction={handleRowAction}
            show-row-number-column>
        </lightning-datatable>
    </div>
</template>
