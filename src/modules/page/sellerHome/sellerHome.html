<template>
    <div class="slds-p-around_large c-seller-home">
        <!-- Greeting header -->
        <header class="slds-m-bottom_medium">
            <h1 class="slds-text-heading_large c-seller-home__title">Início do vendedor</h1>
            <p class="slds-text-body_regular c-seller-home__subtitle slds-m-top_xx-small">{greeting}</p>
        </header>

        <!-- Row 1: hero KPI cards -->
        <ul class="slds-grid slds-wrap slds-gutters">
            <template for:each={cards} for:item="card">
                <li
                    key={card.id}
                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-vertical_x-small">
                    <lightning-card icon-name={card.icon} class="c-kpi">
                        <span slot="title" class="c-kpi__title">{card.title}</span>
                        <div class="slds-p-horizontal_medium">
                            <p class="c-kpi__desc slds-text-body_small slds-text-color_weak">
                                {card.description}
                            </p>
                            <div class="c-kpi__body slds-m-top_medium">
                                <div class={card.ringClass} aria-hidden="true">
                                    <span class="c-ring__primary">{card.ringPrimary}</span>
                                    <span class="c-ring__label">{card.ringLabel}</span>
                                </div>
                                <ul class="c-legend">
                                    <template for:each={card.legend} for:item="row">
                                        <li key={row.key} class="c-legend__item">
                                            <span class={row.dotClass} aria-hidden="true"></span>
                                            <span class={row.badgeClass}>{row.text}</span>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </div>
                        <div slot="footer" class="slds-text-align_center">
                            <lightning-button
                                label={card.button.label}
                                variant="neutral"
                                data-path={card.button.path}
                                onclick={handleNavigate}>
                            </lightning-button>
                        </div>
                    </lightning-card>
                </li>
            </template>
        </ul>

        <!-- Row 2: today's events, tasks and recent records -->
        <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
            <!-- Today's Events -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-vertical_x-small">
                <lightning-card icon-name="standard:event" class="c-tile">
                    <span slot="title" class="c-kpi__title">Eventos de hoje</span>
                    <template if:false={hasEvents}>
                        <div
                            class="slds-illustration slds-illustration_small slds-p-around_medium slds-text-align_center c-empty">
                            <img src="/images/empty-state-events.svg" alt="" class="c-empty__img" />
                            <p class="slds-text-body_regular slds-text-color_weak slds-m-top_small">
                                Você está livre pelo resto do dia.
                            </p>
                        </div>
                    </template>
                    <div slot="footer" class="slds-text-align_center">
                        <lightning-button label="Ver agenda" variant="neutral"></lightning-button>
                    </div>
                </lightning-card>
            </div>

            <!-- Today's Tasks -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-vertical_x-small">
                <lightning-card icon-name="standard:task" class="c-tile">
                    <span slot="title" class="c-kpi__title">Tarefas de hoje</span>
                    <lightning-button-icon
                        slot="actions"
                        icon-name="utility:down"
                        variant="border-filled"
                        alternative-text="Mais opções"
                        title="Mais opções">
                    </lightning-button-icon>
                    <template if:false={hasTasks}>
                        <div
                            class="slds-illustration slds-illustration_small slds-p-around_medium slds-text-align_center c-empty">
                            <img src="/images/empty-state-tasks.svg" alt="" class="c-empty__img" />
                            <p class="slds-text-body_regular slds-text-color_weak slds-m-top_small">
                                Nada pendente hoje. Capriche e volte mais tarde.
                            </p>
                        </div>
                    </template>
                    <div slot="footer" class="slds-text-align_center">
                        <lightning-button label="Ver tudo" variant="neutral"></lightning-button>
                    </div>
                </lightning-card>
            </div>

            <!-- Recent Records -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-vertical_x-small">
                <lightning-card icon-name="standard:record" class="c-tile">
                    <span slot="title" class="c-kpi__title">Registros recentes</span>
                    <ul class="c-recent slds-p-horizontal_medium">
                        <template for:each={recentRecords} for:item="rec">
                            <li key={rec.id} class="c-recent__item">
                                <lightning-icon
                                    icon-name={rec.icon}
                                    size="small"
                                    alternative-text=""
                                    class="slds-m-right_small">
                                </lightning-icon>
                                <a
                                    href="#"
                                    class="c-recent__link slds-truncate"
                                    title={rec.name}
                                    data-path={rec.path}
                                    onclick={handleNavigate}>{rec.name}</a>
                            </li>
                        </template>
                    </ul>
                </lightning-card>
            </div>
        </div>
    </div>
</template>
