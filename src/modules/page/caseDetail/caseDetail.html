<template>
    <div class="slds-p-horizontal_medium slds-p-bottom_large">
        <template lwc:if={hasCase}>
            <!-- ===== Highlights Panel ===== -->
            <div class="slds-page-header slds-page-header_record-home">
                <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon
                                    icon-name="standard:case"
                                    size="medium"
                                    alternative-text="Case">
                                </lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-page-header__name">
                                    <div class="slds-page-header__name-title">
                                        <h1>
                                            <span class="slds-page-header__title-meta-text">{caseNumberLabel}</span>
                                            <span class="slds-page-header__title slds-truncate" title={caseTitle}>{caseTitle}</span>
                                        </h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="slds-page-header__col-actions">
                        <div class="slds-page-header__controls">
                            <div class="slds-page-header__control">
                                <lightning-button
                                    label="+ Seguir"
                                    variant="neutral">
                                </lightning-button>
                            </div>
                            <div class="slds-page-header__control">
                                <lightning-button-group>
                                    <lightning-button label="Editar" variant="neutral"></lightning-button>
                                    <lightning-button label="Excluir" variant="neutral"></lightning-button>
                                    <lightning-button label="Alterar responsável" variant="neutral"></lightning-button>
                                    <lightning-button-menu
                                        alternative-text="Mais ações"
                                        variant="border-filled"
                                        icon-size="medium"
                                        menu-alignment="right">
                                        <lightning-menu-item label="Fechar caso" value="close"></lightning-menu-item>
                                        <lightning-menu-item label="Escalar" value="escalate"></lightning-menu-item>
                                        <lightning-menu-item label="Clonar" value="clone"></lightning-menu-item>
                                    </lightning-button-menu>
                                </lightning-button-group>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Detail strip -->
                <div class="slds-page-header__row slds-page-header__row_gutters">
                    <div class="slds-page-header__col-details">
                        <ul class="slds-page-header__detail-row">
                            <template for:each={headerFields} for:item="field">
                                <li key={field.key} class="slds-page-header__detail-block">
                                    <p class="slds-text-title slds-truncate slds-m-bottom_xx-small" title={field.label}>{field.label}</p>
                                    <p class="slds-truncate" title={field.value}>{field.value}</p>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- ===== Path + Mark Complete ===== -->
            <article class="slds-card slds-m-vertical_small">
                <div class="slds-card__body slds-card__body_inner">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <div class="slds-col">
                            <div class="slds-path">
                                <div class="slds-path__track">
                                    <div class="slds-grid slds-path__scroller-container">
                                        <div class="slds-path__scroller" role="application">
                                            <div class="slds-path__scroller_inner">
                                                <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal" aria-label="Status do caso">
                                                    <template for:each={pathStages} for:item="stage">
                                                        <li key={stage.key} class={stage.itemClass} role="presentation">
                                                            <a
                                                                aria-selected={stage.ariaSelected}
                                                                class="slds-path__link"
                                                                href="#"
                                                                role="option"
                                                                tabindex={stage.tabIndex}
                                                                data-stage={stage.key}
                                                                onclick={handleStageClick}>
                                                                <span class="slds-path__stage">
                                                                    <lightning-icon
                                                                        lwc:if={stage.isComplete}
                                                                        icon-name="utility:check"
                                                                        size="x-small"
                                                                        variant="inverse"
                                                                        alternative-text="Stage complete">
                                                                    </lightning-icon>
                                                                    <span lwc:if={stage.isCurrent} class="slds-assistive-text">Current Stage:</span>
                                                                </span>
                                                                <span class="slds-path__title">{stage.label}</span>
                                                            </a>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-col slds-no-flex slds-m-left_small">
                            <lightning-button
                                variant="brand"
                                label={markCompleteLabel}
                                icon-name="utility:check"
                                disabled={isClosed}
                                onclick={handleMarkComplete}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </article>

            <!-- ===== Console 2-column body (66% / 33%) ===== -->
            <div class="slds-grid slds-gutters_small slds-wrap slds-m-top_medium">

                <!-- Left column (8/12 ≈ 66%): tabbed work area -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                    <lightning-card hide-header>
                        <div class="slds-tabs_default slds-p-bottom_small slds-p-horizontal_medium">
                            <ul class="slds-tabs_default__nav" role="tablist">
                                <template for:each={tabs} for:item="tab">
                                    <li key={tab.value} class={tab.itemClass} title={tab.label} role="presentation">
                                        <a class="slds-tabs_default__link" href="#" role="tab" tabindex={tab.tabIndex} aria-selected={tab.ariaSelected} data-tab={tab.value} onclick={handleTabSelect}>{tab.label}</a>
                                    </li>
                                </template>
                            </ul>

                            <!-- Tab: Feed -->
                            <div class={feedContentClass} role="tabpanel">
                                <div class="slds-p-vertical_medium">

                                    <!-- Compositor: Publicar | Enquete -->
                                    <div class="slds-tabs_scoped c-feed-composer-card slds-m-bottom_medium">
                                        <ul class="slds-tabs_scoped__nav c-feed-tab-nav" role="tablist">
                                            <template for:each={composerTabs} for:item="ct">
                                                <li key={ct.value} class={ct.itemClass} role="presentation">
                                                    <a class="slds-tabs_scoped__link" href="#" role="tab" data-composer={ct.value} aria-selected={ct.ariaSelected} tabindex={ct.tabIndex} onclick={handleComposerTab}>{ct.label}</a>
                                                </li>
                                            </template>
                                        </ul>
                                        <div class="slds-tabs_scoped__content slds-show c-feed-tab-content">
                                            <div class="c-feed-composer">
                                                <div class="c-feed-composer__input">
                                                    <lightning-input
                                                        type="text"
                                                        label="Compartilhar atualização"
                                                        variant="label-hidden"
                                                        placeholder="Compartilhe uma atualização..."
                                                        value={feedComment}
                                                        onchange={handleFeedChange}>
                                                    </lightning-input>
                                                </div>
                                                <lightning-button
                                                    label="Compartilhar"
                                                    variant="brand"
                                                    onclick={handleFeedShare}>
                                                </lightning-button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Barra: ordenação + busca + ações -->
                                    <div class="c-feed-toolbar slds-m-bottom_small">
                                        <div class="c-feed-toolbar__left">
                                            <lightning-button-menu
                                                variant="bare"
                                                menu-alignment="left"
                                                label={feedSortLabel}
                                                alternative-text="Ordenar feed"
                                                onselect={handleFeedSort}>
                                                <template for:each={feedSortOptions} for:item="opt">
                                                    <lightning-menu-item key={opt.value} value={opt.value} label={opt.label}></lightning-menu-item>
                                                </template>
                                            </lightning-button-menu>
                                        </div>
                                        <div class="c-feed-toolbar__right">
                                            <div class="c-feed-search">
                                                <lightning-input
                                                    type="search"
                                                    label="Pesquisar no feed"
                                                    variant="label-hidden"
                                                    placeholder="Pesquisar no feed..."
                                                    value={feedSearch}
                                                    onchange={handleFeedSearch}>
                                                </lightning-input>
                                            </div>
                                            <lightning-button-icon
                                                icon-name="utility:sort"
                                                variant="border-filled"
                                                alternative-text="Ordenar"
                                                title="Ordenar">
                                            </lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:refresh"
                                                variant="border-filled"
                                                alternative-text="Atualizar"
                                                title="Atualizar">
                                            </lightning-button-icon>
                                        </div>
                                    </div>

                                    <!-- Filtros do feed -->
                                    <div class="slds-tabs_default c-feed-filters">
                                        <ul class="slds-tabs_default__nav" role="tablist">
                                            <template for:each={feedFilters} for:item="f">
                                                <li key={f.value} class={f.itemClass} title={f.label} role="presentation">
                                                    <a class="slds-tabs_default__link" href="#" role="tab" data-filter={f.value} aria-selected={f.ariaSelected} tabindex={f.tabIndex} onclick={handleFeedFilter}>{f.label}</a>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>

                                    <!-- Lista do feed -->
                                    <div class="slds-feed c-feed-container">
                                        <ul class="slds-feed__list c-feed-list">
                                            <template for:each={feedPosts} for:item="post">
                                                <li key={post.id} class="slds-feed__item c-post">
                                                    <article class="slds-post">
                                                        <header class="slds-post__header slds-media">
                                                            <div class="slds-media__figure c-post__toggle">
                                                                <lightning-icon icon-name="utility:chevrondown" size="xx-small" alternative-text="Recolher publicação"></lightning-icon>
                                                            </div>
                                                            <div class="slds-media__figure">
                                                                <lightning-avatar variant="circle" size="small" initials={post.initials} fallback-icon-name="standard:user" alternative-text={post.author}></lightning-avatar>
                                                            </div>
                                                            <div class="slds-media__body">
                                                                <div class="slds-grid slds-grid_align-spread">
                                                                    <a href="#" class="c-post__author">{post.author}</a>
                                                                    <span class="c-post__date">{post.date}</span>
                                                                </div>
                                                                <p class="c-post__recipient">
                                                                    <span class="c-post__recipient-icon">
                                                                        <lightning-icon icon-name="utility:world" size="xx-small" variant="inverse"></lightning-icon>
                                                                    </span>
                                                                    {post.recipient}
                                                                </p>
                                                                <div class="slds-post__content slds-text-longform c-post__content">
                                                                    <p>{post.body}</p>
                                                                </div>
                                                                <div class="c-post__footer">
                                                                    <a href="#" class="c-post__action">
                                                                        <lightning-icon icon-name="utility:comments" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                                        Comentar
                                                                    </a>
                                                                </div>
                                                            </div>
                                                        </header>
                                                    </article>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>

                                </div>
                            </div>

                            <!-- Tab: Relacionado (nested cards: casos + knowledge + arquivos) -->
                            <div class={relatedContentClass} role="tabpanel">
                                <div class="slds-p-vertical_medium c-related-stack">

                                    <!-- Nested card: Casos relacionados -->
                                    <article class="slds-card slds-card_boundary">
                                        <div class="slds-card__header slds-grid">
                                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                                <div class="slds-media__figure">
                                                    <lightning-icon icon-name="standard:case" size="small" alternative-text="Casos"></lightning-icon>
                                                </div>
                                                <div class="slds-media__body">
                                                    <h2 class="slds-card__header-title">
                                                        <span class="slds-truncate" title={nestedCasesTitle}>{nestedCasesTitle}</span>
                                                    </h2>
                                                </div>
                                            </header>
                                            <div class="slds-no-flex">
                                                <lightning-button-menu
                                                    alternative-text="Mais ações"
                                                    variant="bare"
                                                    icon-size="x-small"
                                                    menu-alignment="right">
                                                    <lightning-menu-item label="Novo caso" value="new"></lightning-menu-item>
                                                </lightning-button-menu>
                                            </div>
                                        </div>
                                        <div class="slds-card__body">
                                            <template lwc:if={hasRelatedCases}>
                                                <div class="slds-grid slds-wrap slds-p-left_medium slds-p-bottom_small">
                                                    <template for:each={relatedCases} for:item="rc">
                                                        <div key={rc.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                                                            <div class="slds-tile">
                                                                <p class="slds-tile__title slds-truncate">
                                                                    <a href="#" data-id={rc.id} onclick={handleRelatedCaseClick}>{rc.caseNumber}</a>
                                                                </p>
                                                                <div class="slds-tile__detail">
                                                                    <dl class="slds-list_horizontal slds-wrap">
                                                                        <dt class="slds-item_label slds-text-color_weak slds-truncate">Assunto:</dt>
                                                                        <dd class="slds-item_detail slds-truncate">{rc.subject}</dd>
                                                                        <dt class="slds-item_label slds-text-color_weak slds-truncate">Status:</dt>
                                                                        <dd class="slds-item_detail slds-truncate">{rc.status}</dd>
                                                                    </dl>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <template lwc:if={hasRelatedCases}>
                                            <footer class="slds-card__footer">
                                                <a href="#">Ver todos</a>
                                            </footer>
                                        </template>
                                    </article>

                                    <!-- Nested card: Knowledge -->
                                    <article class="slds-card slds-card_boundary">
                                        <div class="slds-card__header slds-grid">
                                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                                <div class="slds-media__figure">
                                                    <lightning-icon icon-name="standard:knowledge" size="small" alternative-text="Knowledge"></lightning-icon>
                                                </div>
                                                <div class="slds-media__body">
                                                    <h2 class="slds-card__header-title">
                                                        <span class="slds-truncate">Knowledge</span>
                                                    </h2>
                                                </div>
                                            </header>
                                            <div class="slds-no-flex">
                                                <lightning-button-menu
                                                    alternative-text="Mais ações"
                                                    variant="bare"
                                                    icon-size="x-small"
                                                    menu-alignment="right">
                                                    <lightning-menu-item label="Pesquisar" value="search"></lightning-menu-item>
                                                </lightning-button-menu>
                                            </div>
                                        </div>
                                        <div class="slds-card__body">
                                            <div class="slds-p-horizontal_medium slds-p-bottom_x-small">
                                                <lightning-input
                                                    type="search"
                                                    label="Pesquisar na base de conhecimento"
                                                    variant="label-hidden"
                                                    placeholder="Pesquisar...">
                                                </lightning-input>
                                            </div>
                                            <div class="slds-p-horizontal_medium slds-p-top_medium slds-p-bottom_medium">
                                                <p class="c-section-label slds-m-bottom_xx-small">Artigos sugeridos</p>
                                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">{suggestedCountMeta}</p>
                                                <ul>
                                                    <template for:each={suggestedArticles} for:item="art">
                                                        <li key={art.id} class="c-article-row slds-p-vertical_x-small">
                                                            <a href="#" class="slds-truncate c-article-link" title={art.title}>{art.title}</a>
                                                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{art.number} &middot; Publicado {art.publishedDate}</p>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </div>
                                    </article>

                                    <!-- Nested card: Arquivos -->
                                    <article class="slds-card slds-card_boundary">
                                        <div class="slds-card__header slds-grid">
                                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                                <div class="slds-media__figure">
                                                    <lightning-icon icon-name="standard:file" size="small" alternative-text="Arquivos"></lightning-icon>
                                                </div>
                                                <div class="slds-media__body">
                                                    <h2 class="slds-card__header-title">
                                                        <span class="slds-truncate" title={nestedFilesTitle}>{nestedFilesTitle}</span>
                                                    </h2>
                                                </div>
                                            </header>
                                            <div class="slds-no-flex slds-grid slds-grid_vertical-align-center">
                                                <lightning-button
                                                    label="Carregar arquivo"
                                                    icon-name="utility:upload"
                                                    variant="neutral">
                                                </lightning-button>
                                                <lightning-button-menu
                                                    alternative-text="Mais ações"
                                                    variant="bare"
                                                    icon-size="x-small"
                                                    menu-alignment="right"
                                                    class="slds-m-left_x-small">
                                                    <lightning-menu-item label="Nova pasta" value="folder"></lightning-menu-item>
                                                </lightning-button-menu>
                                            </div>
                                        </div>
                                        <div class="slds-card__body">
                                            <template lwc:if={hasFiles}>
                                                <ul class="slds-has-dividers_around-space slds-m-around_small">
                                                    <template for:each={files} for:item="file">
                                                        <li key={file.id} class="slds-item slds-media slds-media_center">
                                                            <div class="slds-media__figure">
                                                                <lightning-icon icon-name={file.iconName} size="small" alternative-text="Arquivo"></lightning-icon>
                                                            </div>
                                                            <div class="slds-media__body">
                                                                <p class="slds-truncate"><a href="#" title={file.name}>{file.name}</a></p>
                                                                <p class="slds-text-body_small slds-text-color_weak">{file.metaText}</p>
                                                            </div>
                                                            <div class="slds-media__figure slds-media__figure_reverse">
                                                                <lightning-button-icon
                                                                    icon-name="utility:download"
                                                                    variant="bare"
                                                                    alternative-text="Baixar"
                                                                    title="Baixar">
                                                                </lightning-button-icon>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </template>
                                            <template lwc:else>
                                                <div class="slds-p-around_medium">
                                                    <div class="c-file-drop">
                                                        <lightning-button
                                                            label="Carregar arquivo"
                                                            icon-name="utility:upload"
                                                            variant="neutral">
                                                        </lightning-button>
                                                        <span class="slds-m-left_small slds-text-body_small slds-text-color_weak">Ou arraste-o aqui</span>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </article>

                                </div>
                            </div>
                        </div>
                    </lightning-card>
                </div>

                <!-- Right column (4/12 ≈ 33%): milestones + collapsible info -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 c-card-stack">

                    <!-- SLA / Qualidade do serviço -->
                    <article class="slds-card">
                        <div class="slds-card__header slds-grid">
                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:case_milestone" size="small" alternative-text="SLA"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h2 class="slds-card__header-title c-sla-card__title">
                                        <span class="slds-truncate">Qualidade do serviço (SLA)</span>
                                    </h2>
                                </div>
                            </header>
                        </div>
                        <div class="slds-card__body slds-card__body_inner">
                            <template for:each={milestones} for:item="ms">
                                <div key={ms.id} class="slds-tile slds-m-bottom_small">
                                    <p class="slds-tile__title c-sla-tile__title">{ms.label}</p>
                                    <div class="slds-tile__detail">
                                        <p class={ms.detailClass}>{ms.detail}</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <footer class="slds-card__footer">
                            <a href="#" onclick={handleMarkComplete}>Marcar completo</a>
                        </footer>
                    </article>

                    <!-- Headerless card with collapsible info sections -->
                    <article class="slds-card">
                        <div class="slds-card__body slds-card__body_inner slds-p-vertical_x-small">

                            <!-- Informações gerais -->
                            <div class="c-section-item">
                                <button aria-expanded={generalSection.open} class="c-section-header" data-section="general" onclick={handleSection}>
                                    <lightning-icon icon-name={generalSection.icon} size="xx-small" alternative-text="Alternar seção"></lightning-icon>
                                    <span class="slds-truncate">{generalSection.label}</span>
                                </button>
                                <template lwc:if={generalSection.open}>
                                    <div class="c-field-grid slds-p-horizontal_small slds-p-bottom_small">
                                        <template for:each={generalFields} for:item="field">
                                            <div key={field.key} class="c-field-grid__item">
                                                <lightning-input
                                                    label={field.label}
                                                    value={field.value}
                                                    read-only>
                                                </lightning-input>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <!-- Informações de contato -->
                            <div class="c-section-item">
                                <button aria-expanded={contactSection.open} class="c-section-header" data-section="contact" onclick={handleSection}>
                                    <lightning-icon icon-name={contactSection.icon} size="xx-small" alternative-text="Alternar seção"></lightning-icon>
                                    <span class="slds-truncate">{contactSection.label}</span>
                                </button>
                                <template lwc:if={contactSection.open}>
                                    <div class="c-field-grid slds-p-horizontal_small slds-p-bottom_small">
                                        <template for:each={contactInfoFields} for:item="field">
                                            <div key={field.key} class="c-field-grid__item">
                                                <lightning-input
                                                    label={field.label}
                                                    value={field.value}
                                                    read-only>
                                                </lightning-input>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <!-- Informações de sistema -->
                            <div class="c-section-item">
                                <button aria-expanded={systemSection.open} class="c-section-header" data-section="system" onclick={handleSection}>
                                    <lightning-icon icon-name={systemSection.icon} size="xx-small" alternative-text="Alternar seção"></lightning-icon>
                                    <span class="slds-truncate">{systemSection.label}</span>
                                </button>
                                <template lwc:if={systemSection.open}>
                                    <div class="c-field-grid slds-p-horizontal_small slds-p-bottom_small">
                                        <template for:each={systemFields} for:item="field">
                                            <div key={field.key} class="c-field-grid__item">
                                                <lightning-input
                                                    label={field.label}
                                                    value={field.value}
                                                    read-only>
                                                </lightning-input>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                        </div>
                    </article>
                </div>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center">
                <p class="slds-text-heading_medium">Caso não encontrado</p>
                <p class="slds-m-top_small">
                    <lightning-button label="Voltar para Casos" variant="brand" onclick={handleBackToList}></lightning-button>
                </p>
            </div>
        </template>
    </div>
</template>
